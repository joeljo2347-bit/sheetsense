[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetsense"
version = "0.1.0"
description = "Ask your spreadsheets questions in plain English and get exact answers. A local model writes the SQL; SQLite does the math."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Joel Jo" }]
dependencies = ["openpyxl>=3.1"]
keywords = ["spreadsheet", "excel", "sql", "llm", "ollama", "local-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sheetsense = "sheetsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
