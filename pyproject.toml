[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetsense"
version = "0.1.0"
description = "Ask your spreadsheets questions in plain English and get exact answers. A local model writes the SQL; SQLite does the math."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Joel Jo" }]
dependencies = ["openpyxl>=3.1"]
keywords = ["spreadsheet", "excel", "sql", "llm", "local-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
sheetsense = "sheetsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sheetsense = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 150
target-version = "py39"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# UP rules that rewrite Optional[X] as X | None are left off: Python 3.9 evaluates pydantic and
# TypedDict annotations at runtime, where that syntax fails. B008 flags FastAPI's File(...) idiom.
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
exclude = ['\.venv/', 'build/', 'dist/']
